name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read        # checkout
  checks: write         # dorny/test-reporter publishes a check run
  pull-requests: write  # test-reporter annotates the PR
  # Covers same-repository PRs, Dependabot's included. It does NOT cover PRs from
  # forks: those get a read-only GITHUB_TOKEN regardless of this block, which is
  # why the report step carries an explicit same-repo guard.

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_ARGS: -B --no-transfer-progress -Dstyle.color=never

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'   # matches <java.version> in pom.xml — bump both together
          cache: maven

      # Testcontainers (PostgreSQLContainer) fails late and cryptically if the daemon
      # is unreachable. Failing here names the cause in one line.
      - name: Verify Docker is reachable
        run: docker info

      # Split from the test run on purpose: a compilation or packaging failure
      # surfaces as its own red step rather than being buried in a test report.
      - name: Build
        run: mvn $MAVEN_ARGS clean install -DskipTests

      # -fae surfaces every failing module in one run instead of stopping at the first.
      - name: Test
        run: mvn $MAVEN_ARGS -fae verify

      - name: Test report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: (success() || failure()) && github.event.pull_request.head.repo.full_name == github.repository
        with:
          name: Tests
          path: '**/target/*-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: true

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/target/*-reports/*.txt'
          retention-days: 7

  # The frontend module in ui/. No `needs:` — a UI failure and a backend failure are
  # independent signals, and the Java job must not have to wait on Node (research R3,
  # github-ci-standards).
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npx vitest run --reporter=junit --outputFile=test-results/junit.xml
        env:
          CI: 'true'

      - name: Build
        run: npm run build

      - name: Test report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: (success() || failure()) && github.event.pull_request.head.repo.full_name == github.repository
        with:
          name: UI Tests
          path: 'ui/test-results/junit.xml'
          reporter: java-junit
          fail-on-error: true
